name: splg_driver
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Stacked
  stacked: ^3.4.0
  stacked_services: ^1.1.0
  # icons
  bootstrap_icons: ^1.11.3
  # internationalization
  intl: ^0.20.2
  # firebase
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  firebase_messaging: ^16.1.0
  # permissions
  permission_handler: ^12.0.1
  # geolocator
  geolocator: ^14.0.2
  # google maps
  google_maps_flutter: ^2.14.0
  # http client
  dio: ^5.8.0+1
  pretty_dio_logger: ^1.4.0
  # realtime (tracking en vivo del chofer)
  socket_io_client: ^3.1.2
  # abrir apps externas de navegación (Waze / Google Maps)
  url_launcher: ^6.3.1
  # renderizar el QR de entrega en la pantalla de entrega en curso
  qr_flutter: ^4.1.0
  # foto opcional al reportar que el cliente no pagó
  image_picker: ^1.1.2
  # splg_lib
  splg_lib:
    path: ../splg-lib
  # Idempotency-Key para requests idempotentes (ej: aceptar pedido)
  uuid: ^4.5.3
  # Persistencia segura de la sesión (token/userId) entre arranques
  flutter_secure_storage: ^9.2.2
  # Foreground service: mantiene vivo el socket + GPS con la app en background
  # (crítico en apps de reparto — si no, el dispatch pierde al chofer)
  flutter_foreground_task: ^8.17.0
  # render de Términos y Condiciones / Política de Privacidad en markdown
  flutter_markdown_plus: ^1.0.12
  # notificaciones locales (avisar ofertas de pedido cuando FCM llega en foreground)
  flutter_local_notifications: ^19.4.2
  image: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.7.1
  flutter_lints: ^6.0.0
  mockito: ^5.4.1
  stacked_generator: ^2.0.0
  golden_toolkit: ^0.15.0

flutter:
  uses-material-design: true

  assets:
    - legal/